
<!doctype html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="./src/output.css" rel="stylesheet">
    <script type="module" src="./js/sidebar.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

   <div class="flex  min-h-dvh bg-[#EEEBE6]">

        <!-- 側欄 -->
        <aside id="sidebar" class="fixed inset-0 z-50 flex flex-col items-center w-full pt-10 bg-white whitespace-nowrap overflow-hidden -translate-x-full
            transition-all duration-300 lg:static lg:inset-auto lg:w-64 lg:shrink-0 lg:translate-x-0 lg:rounded-r-3xl lg:border lg:border-gray-200 lg:shadow-lg">
                    <!--shrink-0死守自己原本設定的寬度或高度 -->
                    <!-- 標題 -->
            <p class="font-bold text-2xl xl:text-3xl whitespace-nowrap">資產儀表板</p>
            

            <!-- 選單 -->
            <nav class="w-full px-3 mt-8  ">
                <a href="index.html" class="flex items-center px-4 py-3 text-lg xl:text-xl rounded-xl text-[#2F6B63] font-bold
                   hover:bg-[#EEEBE6] hover:scale-105 transition-all ">
                   <!--transition-all  duration-200 
                   讓元素的所有樣式變化，都以 0.2 秒（200 毫秒）的平滑過渡動畫呈現-->
                    <i data-lucide="layout-dashboard" class="w-6 h-6 shrink-0"></i>
                    總覽
                </a>

                <a href="#" class="flex items-center px-4 py-3 text-lg xl:text-xl rounded-xl font-bold
                   hover:bg-[#EEEBE6] hover:scale-105 transition-all ">
                    <i data-lucide="wallet" class="w-6 h-6 shrink-0"></i>
                    存款
                </a>

                <a href="stock.html" class="flex items-center px-4 py-3 text-lg xl:text-xl rounded-xl 
                   hover:bg-[#EEEBE6] hover:scale-105 transition-all ">
                    <i data-lucide="chart-no-axes-combined" class="w-6 h-6 shrink-0"></i>
                    證券
                </a>

               <a href="#" class="flex items-center px-4 py-3 text-lg xl:text-xl rounded-xl font-bold
                   hover:bg-[#EEEBE6] hover:scale-105 transition-all ">
                    <i data-lucide="house" class="w-6 h-6 shrink-0"></i>
                    房屋貸款
                </a>
            </nav>
        </aside>

        <!-- 主內容 -->
        <main class="flex-1 min-w-0 w-full p-3 md:p-4 lg:p-5 flex flex-col min-h-dvh">
            <button id="toggleBtn" type="button" class="mt-1 mb-2 ml-2 rounded-lg w-10 h-8 bg-[#2F6B63] text-[#ffffff] hover:bg-[#17a379] 
                hover:scale-120  transition-colors duration-200" aria-label="切換側邊欄">
                ☰
            </button>
            <!-- 內容grid -->
            <header class="grid grid-cols-1 lg:grid-cols-3 gap-4 md:gap-5 items-stretch">
               
            </div>

        </main>

    </div>


        <!-- 載入 Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        lucide.createIcons();

        // 取得圓餅圖的畫布
        const ctx = document.getElementById('stockPieChart');

        // 建立圓餅圖
        new Chart(ctx, {
            type: 'pie',

            data: {
                labels: ['台積電', '鴻海', '0050','1234','5555'],

                datasets: [{
                    data: [100000, 32000, 55500,1111,5555],

                    backgroundColor: [
                        '#2F6B63',
                        '#64817B',
                        '#B8C9B8'
                    ],

                    borderWidth: 0
                }]
            },

           options: {
                responsive: true,
                maintainAspectRatio: false,

                layout: {
                    padding: 0
                },

                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: {
                            boxWidth: 12,
                            boxHeight: 10,
                            padding: 6,
                            font: {
                                size: 15
                            }
                        }
                    }
                }
            }
                    });
    </script>

</body>
</html>
