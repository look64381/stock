
<!doctype html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="./src/output.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script type="module" src="./js/stock.js"></script>
    <script type="module" src="./js/sidebar.js"></script>
</head>

<body>

   <div class="flex h-dvh overflow-hidden bg-[#EEEBE6]">

            <!-- 側欄 -->
    <aside id="sidebar" class="fixed inset-0 z-100 flex flex-col items-center w-full h-dvh pt-10 bg-white overflow-hidden -translate-x-full
        transition-all duration-300 lg:relative lg:inset-auto lg:h-dvh lg:overflow-y-auto lg:translate-x-0 lg:w-64 lg:shrink-0 lg:rounded-r-3xl lg:border lg:border-gray-200 lg:shadow-lg">
                <!--shrink-0死守自己原本設定的寬度或高度 -->
                <!-- 標題 -->
            <div class="flex items-center justify-between w-full px-5">
                <p class="font-bold text-2xl">
                    資產儀表板
                </p>

                <button id="sidebarclose" type="button" class="lg:hidden" aria-label="關閉側邊欄">
                    <i data-lucide="x"></i>
                </button>
            </div>
            

            <!-- 選單 -->
            <nav class="w-full px-3 mt-8  ">
                <a href="index.html" class="flex items-center px-4 py-3 text-lg xl:text-xl rounded-xl font-bold
                   hover:bg-[#EEEBE6] hover:scale-105 transition-all ">
                   <!--transition-all  duration-200 
                   讓元素的所有樣式變化，都以 0.2 秒（200 毫秒）的平滑過渡動畫呈現-->
                    <i data-lucide="layout-dashboard" class="w-6 h-6 shrink-0"></i>
                    總覽
                </a>

                <a href="#" class="flex items-center px-4 py-3 text-lg xl:text-xl rounded-xl font-bold
                   hover:bg-[#EEEBE6] hover:scale-105 transition-all ">
                    <i data-lucide="wallet" class="w-6 h-6 shrink-0"></i>
                    存款
                </a>

                <a href="#" class="flex items-center px-4 py-3 text-lg xl:text-xl rounded-xl text-[#2F6B63] font-bold
                   hover:bg-[#EEEBE6] hover:scale-105 transition-all ">
                    <i data-lucide="chart-no-axes-combined" class="w-6 h-6 shrink-0"></i>
                    證券
                </a>

               <a href="#" class="flex items-center px-4 py-3 text-lg xl:text-xl rounded-xl font-bold
                   hover:bg-[#EEEBE6] hover:scale-105 transition-all ">
                    <i data-lucide="house" class="w-6 h-6 shrink-0"></i>
                    房屋貸款
                </a>
            </nav>
        </aside>

        <!-- 主內容 -->
        <main class="flex-1 min-w-0 w-full h-dvh min-h-0 overflow-y-auto overscroll-contain px-3 pb-3 pt-2 md:px-4 md:pb-4 lg:px-5 lg:pb-5 flex flex-col">
            <button id="sidebarbtn" type="button" aria-controls="sidebar" aria-expanded="false" class="mt-1 mb-2 ml-2 rounded-lg w-10 h-8 bg-[#2F6B63] text-[#ffffff] hover:bg-[#17a379] 
            hover:scale-120  transition-colors duration-200" aria-label="切換側邊欄">
             ☰
            </button>
            <!-- 內容grid -->
            <header class="grid grid-cols-1 lg:grid-cols-3 gap-4 md:gap-5 items-stretch">


                <!-- 證券總市值 -->
                <section class="min-w-0 w-full bg-white rounded-2xl shadow-lg p-4 sm:p-5 md:p-6 flex flex-col justify-center">

                    <p class="text-base sm:text-xl md:text-2xl font-medium text-[#64817B]">
                      證券總市值
                    </p>

                    <p class="text-base sm:text-4xl xl:text-5xl font-bold mt-2 text-[#2F6B63] tracking-tight wrap-break-word">
                        1,410,000
                    </p>

                    <p class="text-sm  sm:text-lg  mt-2">
                        今日 +9,000
                    </p>
                </section>


                <!-- 收盤價更新 -->
                <section class="min-w-0 w-full bg-white rounded-2xl shadow-lg p-4 sm:p-5 md:p-6 flex flex-col justify-center">

                    <p class="text-base sm:text-xl md:text-2xl font-medium text-[#64817B]">
                        收盤價更新
                    </p>

                    <p class="text-xs sm:text-xl md:text-2xl font-bold mt-4 wrap-break-word text-[#2F6B63]">
                        已自動更新：
                        
                    </p>
                     <p class="text-xs sm:text-xl md:text-2xl font-bold mt-4 wrap-break-word text-[#2F6B63]">
                        2026-11-12 收盤價
                    </p>
                </section>

                <!-- 持股分布 -->
                <section class="min-w-0 w-full h-55 bg-white rounded-2xl shadow-lg p-4 flex flex-col overflow-hidden">

                    <h2 class="text-base lg:text-xl font-bold text-[#2F6B63] mb-1 shrink-0">
                        持股分布
                    </h2>

                    <!-- 圓餅圖容器 -->
                    <div class="relative w-full flex-1 min-h-0 text-xs" >
                        <canvas id="stockPieChart"></canvas>
                    </div>

                </section>

            </header>
            <!--表格-->
            <div class="mt-4 flex-1 flex flex-col">
                <section class="min-w-0 flex-1 bg-white rounded-2xl shadow-lg p-4 sm:p-6">
                    <!-- 標題列 -->
                    <div class="mb-5">
                        <div class="flex items-center justify-between gap-3">
                            <h2 class="text-xl sm:text-2xl font-bold text-[#2F6B63]">
                                我的持有股票
                            </h2>

                            <button id="openAddStock" type="button" class="bg-[#2F6B63] text-white px-4 py-2 rounded-xl hover:bg-[#22867b] hover:scale-105
                                transition whitespace-nowrap">
                                + 新增股票
                            </button>
                        </div>

                        <div class="mt-3">
                            <input id="stockSearchInput" type="search" placeholder="搜尋名稱或代號" autocomplete="off"
                                class="w-full rounded-xl border border-gray-300 bg-white px-4 py-2 text-sm outline-none focus:border-[#2F6B63] focus:ring-2 focus:ring-[#2F6B63]/20">
                        </div>
                    </div>
                    <!-- 股票表格容器 -->
                   <div class="w-full min-w-0 overflow-x-auto">

                        <table class="w-full min-w-[900px] table-fixed border-collapse text-center">
                            <colgroup>
                                <col style="width: 20%">
                                <col style="width: 12%">
                                <col style="width: 16%">
                                <col style="width: 16%">
                                <col style="width: 18%">
                                <col style="width: 18%">
                            </colgroup>
                          

                            <!-- 表格標題 -->
                            <thead>

                                <tr class="border-b border-gray-300  font-medium">

                                    <th scope="col" class="px-3 py-4 whitespace-nowrap" aria-sort="none">
                                        <button type="button" data-sort-key="name" data-sort-label="股票" data-sort-default="asc" class="inline-flex items-center gap-1.5 rounded px-1 py-1 hover:text-[#2F6B63] focus:outline-none focus-visible:ring-2 focus-visible:ring-[#2F6B63] cursor-pointer">
                                            股票
                                            <svg data-sort-icon class="h-5 w-5 text-gray-400 transition-transform" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                                                <path data-sort-arrow="asc" d="M5 7l3-3 3 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                                                <path data-sort-arrow="desc" d="M5 9l3 3 3-3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                                            </svg>
                                        </button>
                                    </th>

                                    <th scope="col" class="px-3 py-4 whitespace-nowrap" aria-sort="none">
                                        <button type="button" data-sort-key="shares" data-sort-label="持有股數" data-sort-default="desc" class="inline-flex items-center gap-1.5 rounded px-1 py-1 hover:text-[#2F6B63] focus:outline-none focus-visible:ring-2 focus-visible:ring-[#2F6B63] cursor-pointer">
                                            持有股數
                                            <svg data-sort-icon class="h-5 w-5 text-gray-400 transition-transform cursor-pointer" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                                                <path data-sort-arrow="asc" d="M5 7l3-3 3 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                                                <path data-sort-arrow="desc" d="M5 9l3 3 3-3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                                            </svg>
                                        </button>
                                    </th>

                                    <th scope="col" class="px-3 py-4 whitespace-nowrap" aria-sort="none">
                                        <button type="button" data-sort-key="cost" data-sort-label="平均成本" data-sort-default="asc" class="inline-flex items-center gap-1.5 rounded px-1 py-1 hover:text-[#2F6B63] focus:outline-none focus-visible:ring-2 focus-visible:ring-[#2F6B63] cursor-pointer">
                                            平均成本
                                            <svg data-sort-icon class="h-5 w-5 text-gray-400 transition-transform" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                                                <path data-sort-arrow="asc" d="M5 7l3-3 3 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                                                <path data-sort-arrow="desc" d="M5 9l3 3 3-3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                                            </svg>
                                        </button>
                                    </th>

                                    <th scope="col" class="px-3 py-4 whitespace-nowrap" aria-sort="none">
                                        <button type="button" data-sort-key="price" data-sort-label="目前股價" data-sort-default="desc" class="inline-flex items-center gap-1.5 rounded px-1 py-1 hover:text-[#2F6B63] focus:outline-none focus-visible:ring-2 focus-visible:ring-[#2F6B63] cursor-pointer">
                                            目前股價
                                            <svg data-sort-icon class="h-5 w-5 text-gray-400 transition-transform" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                                                <path data-sort-arrow="asc" d="M5 7l3-3 3 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                                                <path data-sort-arrow="desc" d="M5 9l3 3 3-3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                                            </svg>
                                        </button>
                                    </th>

                                    <th scope="col" class="px-3 py-4 whitespace-nowrap" aria-sort="none">
                                        <button type="button" data-sort-key="marketValue" data-sort-label="持有市值" data-sort-default="desc" class="inline-flex items-center gap-1.5 rounded px-1 py-1 hover:text-[#2F6B63] focus:outline-none focus-visible:ring-2 focus-visible:ring-[#2F6B63] cursor-pointer">
                                            持有市值
                                            <svg data-sort-icon class="h-5 w-5 text-gray-400 transition-transform" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                                                <path data-sort-arrow="asc" d="M5 7l3-3 3 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                                                <path data-sort-arrow="desc" d="M5 9l3 3 3-3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                                            </svg>
                                        </button>
                                    </th>

                                    <th scope="col" class="px-3 py-4 whitespace-nowrap" aria-sort="none">
                                        <button type="button" data-sort-key="profit" data-sort-label="未實現損益" data-sort-default="desc" class="inline-flex items-center gap-1.5 rounded px-1 py-1 hover:text-[#2F6B63] focus:outline-none focus-visible:ring-2 focus-visible:ring-[#2F6B63] cursor-pointer">
                                            未實現損益
                                            <svg data-sort-icon class="h-5 w-5 text-gray-400 transition-transform" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                                                <path data-sort-arrow="asc" d="M5 7l3-3 3 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                                                <path data-sort-arrow="desc" d="M5 9l3 3 3-3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                                            </svg>
                                        </button>
                                    </th>

                                </tr>

                            </thead>


                            <!-- 股票資料 -->
                            <tbody id="stockList">

                              

                            </tbody>

                        </table>

                    </div>

                    <div class="mt-3 flex items-center justify-between gap-3 text-sm text-gray-500">
                        <span id="stockResultCount" aria-live="polite"></span>
                        <span id="stockPageRange"></span>
                    </div>

                    <div id="stockPagination" class="hidden mt-4 flex items-center justify-between gap-3" aria-label="股票分頁">
                        <button id="previousStockPage" type="button" class="rounded-lg border border-gray-300 px-3 py-2 text-sm text-gray-700 hover:bg-[#F8F7F4] disabled:cursor-not-allowed disabled:opacity-40">
                            上一頁
                        </button>
                        <span id="stockPageInfo" class="text-sm text-gray-600" aria-live="polite"></span>
                        <button id="nextStockPage" type="button" class="rounded-lg border border-gray-300 px-3 py-2 text-sm text-gray-700 hover:bg-[#F8F7F4] disabled:cursor-not-allowed disabled:opacity-40">
                            下一頁
                        </button>
                    </div>

                </section>
            </div>

        </main>

    </div>



    <dialog id="addStockDialog" class="fixed inset-0 m-auto max-h-[90vh] w-11/12 max-w-xl overflow-y-auto  p-0 shadow-2xl backdrop:bg-black/40">
        <form id="addStockForm" class="p-6 sm:p-8">
            <div class="mb-6 flex items-start justify-between gap-4">
                <div>
                    <h2 class="text-2xl font-bold text-[#2F6B63]">新增持股</h2>
            <p class="mt-1 text-sm text-gray-500">搜尋或輸入股票資料，再填寫買進與目前價格。</p>
                </div>
                <button id="closeAddStock" type="button" class="rounded-lg p-2 text-gray-500 hover:bg-gray-100" aria-label="關閉">✕</button>
            </div>

            <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                <label class="block text-sm font-medium text-gray-700 sm:col-span-2">
                    搜尋股票（名稱或代號）
                    <input id="stockLookupInput" type="search" list="stockCatalogOptions" autocomplete="off" placeholder="輸入股票名稱或代號，例如 2330"
                        class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2.5 outline-none focus:border-[#2F6B63] focus:ring-2 focus:ring-[#2F6B63]/20">
                    <datalist id="stockCatalogOptions"></datalist>
                    <span class="mt-1 block text-xs font-normal text-gray-500">選擇建議會自動填入代號和名稱；未列出的股票可在下方手動輸入。</span>
                </label>
                <label class="block text-sm font-medium text-gray-700">
                    股票代號
                    <input id="stockCodeInput" name="code" type="text" maxlength="10" required autocomplete="off" placeholder="例如 2330"
                        class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2.5 outline-none focus:border-[#2F6B63] focus:ring-2 focus:ring-[#2F6B63]/20">
                </label>
                <label class="block text-sm font-medium text-gray-700">
                    股票名稱
                    <input id="stockNameInput" name="name" type="text" maxlength="40" required placeholder="例如 台積電"
                        class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2.5 outline-none focus:border-[#2F6B63] focus:ring-2 focus:ring-[#2F6B63]/20">
                </label>
                <label class="block text-sm font-medium text-gray-700">
                    本次成交股數
                    <input id="stockSharesInput" name="shares" type="number" min="1" step="1" required placeholder="股數"
                        class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2.5 outline-none focus:border-[#2F6B63] focus:ring-2 focus:ring-[#2F6B63]/20">
                </label>
                <label class="block text-sm font-medium text-gray-700">
                    本次成交均價（每股）
                    <input id="stockExecutionPriceInput" name="executionPrice" type="number" min="0.01" step="0.01" required placeholder="例如 950"
                        class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2.5 outline-none focus:border-[#2F6B63] focus:ring-2 focus:ring-[#2F6B63]/20">
                    <span class="mt-1 block text-xs font-normal text-gray-500">請依券商成交回報輸入，不是下單委託價格。</span>
                </label>
                <label class="block text-sm font-medium text-gray-700">
                    手續費（選填）
                    <input id="stockCommissionInput" name="commission" type="number" min="0" step="0.01" placeholder="例如 20"
                        class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2.5 outline-none focus:border-[#2F6B63] focus:ring-2 focus:ring-[#2F6B63]/20">
                    <span class="mt-1 block text-xs font-normal text-gray-500">填入後會計入持股成本；留白會以 0 計算。</span>
                </label>
                <label class="block text-sm font-medium text-gray-700 sm:col-span-2">
                    目前股價
                    <input id="stockPriceInput" name="price" type="number" min="0.01" step="0.01" required placeholder="例如 1000"
                        class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2.5 outline-none focus:border-[#2F6B63] focus:ring-2 focus:ring-[#2F6B63]/20">
                    <span class="mt-1 block text-xs font-normal text-gray-500">暫時手動輸入目前股價</span>
                </label>
            </div>

            <div class="mt-5 rounded-xl bg-[#F5F7F4] p-4 text-sm">
                <p class="font-semibold text-gray-700">本次成交金額 <span id="previewTransactionAmount" class="float-right">—</span></p>
                <p class="mt-2 text-gray-600">本次買進成本（含手續費） <span id="previewPurchaseCost" class="float-right">—</span></p>
                <p class="mt-2 font-semibold text-[#2F6B63]">更新後平均成本（每股） <span id="previewAverageCost" class="float-right">—</span></p>
                <p class="mt-2 text-gray-600">預估持有市值 <span id="previewMarketValue" class="float-right">—</span></p>
                <p class="mt-2 text-gray-600">預估未實現損益 <span id="previewProfit" class="float-right font-semibold">—</span></p>
            </div>

            <p class="mt-3 text-xs text-gray-500">若已持有相同代號，新增股數與成本會合併，並重新計算平均成本。</p>
            <div class="mt-7 flex justify-end gap-3">
                <button id="cancelAddStock" type="button" class="rounded-xl border border-gray-300 px-4 py-2.5 text-gray-700 hover:bg-gray-50">取消</button>
                <button type="submit" class="rounded-xl bg-[#2F6B63] px-5 py-2.5 font-semibold text-white hover:bg-[#22867b]">新增持股</button>
            </div>
        </form>
    </dialog>

</body>
</html>
