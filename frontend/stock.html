
<!doctype html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="./src/output.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script type="module" src="./js/stock.js"></script>
    <script type="module" src="./js/sidebar.js"></script>
</head>

<body>

   <div class="flex min-h-dvh bg-[#EEEBE6]">

            <!-- 側欄 -->
    <aside id="sidebar" class="fixed inset-0 z-100 flex flex-col items-center w-full h-dvh pt-10 bg-white overflow-hidden -translate-x-full
        transition-all duration-300 lg:relative lg:inset-auto lg:h-auto lg:translate-x-0 lg:w-64 lg:shrink-0 lg:rounded-r-3xl lg:border lg:border-gray-200 lg:shadow-lg">
                <!--shrink-0死守自己原本設定的寬度或高度 -->
                <!-- 標題 -->
            <div class="flex items-center justify-between w-full px-5">
                <p class="font-bold text-2xl">
                    資產儀表板
                </p>

                <button id="sidebarclose" class="lg:hidden">
                    <i data-lucide="x"></i>
                </button>
            </div>
            

            <!-- 選單 -->
            <nav class="w-full px-3 mt-8  ">
                <a href="index.html" class="flex items-center px-4 py-3 text-lg xl:text-xl rounded-xl font-bold
                   hover:bg-[#EEEBE6] hover:scale-105 transition-all ">
                   <!--transition-all  duration-200 
                   讓元素的所有樣式變化，都以 0.2 秒（200 毫秒）的平滑過渡動畫呈現-->
                    <i data-lucide="layout-dashboard" class="w-6 h-6 shrink-0"></i>
                    總覽
                </a>

                <a href="#" class="flex items-center px-4 py-3 text-lg xl:text-xl rounded-xl font-bold
                   hover:bg-[#EEEBE6] hover:scale-105 transition-all ">
                    <i data-lucide="wallet" class="w-6 h-6 shrink-0"></i>
                    存款
                </a>

                <a href="#" class="flex items-center px-4 py-3 text-lg xl:text-xl rounded-xl text-[#2F6B63] font-bold
                   hover:bg-[#EEEBE6] hover:scale-105 transition-all ">
                    <i data-lucide="chart-no-axes-combined" class="w-6 h-6 shrink-0"></i>
                    證券
                </a>

               <a href="#" class="flex items-center px-4 py-3 text-lg xl:text-xl rounded-xl font-bold
                   hover:bg-[#EEEBE6] hover:scale-105 transition-all ">
                    <i data-lucide="house" class="w-6 h-6 shrink-0"></i>
                    房屋貸款
                </a>
            </nav>
        </aside>

        <!-- 主內容 -->
        <main class="flex-1 min-w-0 w-full px-3 pb-3 pt-2 md:px-4 md:pb-4 lg:px-5 lg:pb-5   flex flex-col min-h-dvh">
            <button id="sidebarbtn" type="button" class="mt-1 mb-2 ml-2 rounded-lg w-10 h-8 bg-[#2F6B63] text-[#ffffff] hover:bg-[#17a379] 
            hover:scale-120  transition-colors duration-200" aria-label="切換側邊欄">
             ☰
            </button>
            <!-- 內容grid -->
            <header class="grid grid-cols-1 lg:grid-cols-3 gap-4 md:gap-5 items-stretch">


                <!-- 證券總市值 -->
                <section class="min-w-0 w-full bg-white rounded-2xl shadow-lg p-4 sm:p-5 md:p-6 flex flex-col justify-center">

                    <p class="text-base sm:text-xl md:text-2xl font-medium text-[#64817B]">
                      證券總市值
                    </p>

                    <p class="text-base sm:text-4xl xl:text-5xl font-bold mt-2 text-[#2F6B63] tracking-tight wrap-break-word">
                        1,410,000
                    </p>

                    <p class="text-sm  sm:text-lg  mt-2">
                        今日 +9,000
                    </p>
                </section>


                <!-- 收盤價更新 -->
                <section class="min-w-0 w-full bg-white rounded-2xl shadow-lg p-4 sm:p-5 md:p-6 flex flex-col justify-center">

                    <p class="text-base sm:text-xl md:text-2xl font-medium text-[#64817B]">
                        收盤價更新
                    </p>

                    <p class="text-xs sm:text-xl md:text-2xl font-bold mt-4 wrap-break-word text-[#2F6B63]">
                        已自動更新：
                        
                    </p>
                     <p class="text-xs sm:text-xl md:text-2xl font-bold mt-4 wrap-break-word text-[#2F6B63]">
                        2026-11-12 收盤價
                    </p>
                </section>

                <!-- 持股分布 -->
                <section class="min-w-0 w-full h-55 bg-white rounded-2xl shadow-lg p-4 flex flex-col overflow-hidden">

                    <h2 class="text-base lg:text-xl font-bold text-[#2F6B63] mb-1 shrink-0">
                        持股分布
                    </h2>

                    <!-- 圓餅圖容器 -->
                    <div class="relative w-full flex-1 min-h-0 text-xs" >
                        <canvas id="stockPieChart"></canvas>
                    </div>

                </section>

            </header>
            <!--表格-->
            <div class="mt-4 flex-1 flex flex-col">
                <section class="min-w-0 flex-1 bg-white rounded-2xl shadow-lg p-4 sm:p-6">
                    <!-- 標題列 -->
                    <div class="flex justify-between items-center mb-5">

                        <h2 class="text-xl sm:text-2xl font-bold text-[#2F6B63]">
                            我的持有股票
                        </h2>

                        <button class="bg-[#2F6B63] text-white px-4 py-2 rounded-xl hover:bg-[#22867b] hover:scale-105
                            transition whitespace-nowrap">
                            + 新增股票
                        </button>
                    </div>
                    <!-- 股票表格容器 -->
                   <div class="w-full min-w-0 overflow-x-auto">

                        <table class="w-full min-w-175 table-auto border-collapse text-center">
                          

                            <!-- 表格標題 -->
                            <thead>

                                <tr class="border-b border-gray-300  font-medium">

                                    <th  class="px-3 py-4 whitespace-nowrap">
                                        股票
                                    </th>

                                    <th  class="px-3 py-4 whitespace-nowrap">
                                        持有股數
                                    </th>

                                    <th  class="px-3 py-4 whitespace-nowrap">
                                        平均成本
                                    </th>

                                    <th  class="px-3 py-4 whitespace-nowrap">
                                        目前股價
                                    </th>

                                    <th  class="px-3 py-4 whitespace-nowrap">
                                        持有市值
                                    </th>

                                    <th  class="px-3 py-4 whitespace-nowrap">
                                        未實現損益
                                    </th>

                                </tr>

                            </thead>


                            <!-- 股票資料 -->
                            <tbody id="stockList">

                                <!-- 台積電 -->
                              

                            </tbody>

                        </table>

                    </div>

                </section>
            </div>

        </main>

    </div>



</body>
</html>
